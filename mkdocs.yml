site_name: RUNE Documentation
site_description: Documentation for the RUNE platform, APIs, and compliance posture
site_url: https://github.com/lpasquali/rune-docs
repo_name: lpasquali/rune-docs
repo_url: https://github.com/lpasquali/rune-docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
extra:
  version:
    provider: mike
    default: latest
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Context:
      - System Prompt: context/SYSTEM_PROMPT.md
      - Current State: context/CURRENT_STATE.md
      - Coding Standards: context/CODING_STANDARDS.md
  - Usage:
      - Quickstart: usage/QUICKSTART.md
      - Developer Guide: usage/DEVELOPER_GUIDE.md
      - Guide: usage/GUIDE.md
      - Interfaces: usage/INTERFACES.md
      - API Specification: usage/API_SPEC.md
      - Configuration: usage/CONFIGURATION.md
      - LLM Backend Reference: usage/OLLAMA_REFERENCE.md
  - Delivery:
      - Pipelines: delivery/PIPELINES.md
      - Releases: delivery/RELEASES.md
      - Secrets: delivery/SECRETS.md
      - VEX Register: delivery/VEX.md
      - Milestones: delivery/MILESTONES.md
      - Labels: delivery/LABELS.md
      - Audit Agents: delivery/AUDIT_AGENTS.md
  - Operations:
      - Workstation Setup: operations/WORKSTATION.md
      - Golden Image: operations/GOLDEN_IMAGE.md
      - Deployment: operations/DEPLOYMENT.md
      - Observability: operations/OBSERVABILITY.md
      - Runbooks: operations/RUNBOOKS.md
      - Rollback Procedures: operations/ROLLBACK_PROCEDURES.md
      - Vault Integration: operations/VAULT.md
  - Security:
      - Security Development Lifecycle: security/SDL.md
      - Risk Assessment Methodology: security/RISK_ASSESSMENT.md
      - Risk Register: security/RISK_REGISTER.md
      - Penetration Testing: security/PENTEST.md
      - Fuzz Testing: security/FUZZ_TESTING.md
      - Incident Response: security/INCIDENT_RESPONSE.md
      - Container Image Signing: security/IMAGE_SIGNING.md
      - Security Training Records: security/SECURITY_TRAINING.md
  - Architecture:
      - Threat Model: architecture/THREAT_MODEL.md
      - Security Requirements: architecture/SECURITY_REQUIREMENTS.md
      - System Design: architecture/SYSTEM_DESIGN.md
      - Infrastructure: architecture/INFRASTRUCTURE.md
      - Formal Specs: architecture/FORMAL_SPECS.md
      - ADRs:
          - "0001: Client/Server Compatibility": architecture/adrs/0001-api-compatibility.md
          - "0002: Cost Estimation": architecture/adrs/0002-cost-estimation.md
          - "0003: UI Design": architecture/adrs/0003-ui-design.md
          - "0004: Operator Parity": architecture/adrs/0004-operator-feature-parity.md
          - "0005: Advanced Cognitive Architecture": architecture/adrs/0005-advanced-cognitive-architecture.md
