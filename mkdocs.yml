site_name: RUNE Documentation
site_description: Documentation for the RUNE platform, APIs, and compliance posture
theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
extra_css:
  - overrides/main.css
  - stylesheets/tokens.css
  - stylesheets/print.css

plugins:
  - search
  - mike:
      alias_type: redirect

extra:
  version:
    provider: mike
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Context:
      - System Prompt: context/SYSTEM_PROMPT.md
      - Current State: context/CURRENT_STATE.md
      - Coding Standards: context/CODING_STANDARDS.md
  - Usage:
      - Quickstart: usage/QUICKSTART.md
      - Developer Guide: usage/DEVELOPER_GUIDE.md
      - Guide: usage/GUIDE.md
      - Agent Access Tiers: usage/TIERS.md
      - Interfaces: usage/INTERFACES.md
      - API Specification: usage/API_SPEC.md
      - Advanced Pipelines: usage/ADVANCED_PIPELINES.md
      - Configuration: usage/CONFIGURATION.md
      - LLM Backend Reference: usage/OLLAMA_REFERENCE.md
  - External projects (rune-audit):
