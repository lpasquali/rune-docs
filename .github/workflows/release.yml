name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: lpasquali/rune-ci/.github/workflows/release.yml@36eba801cb73e7b613ef1ee33bb3f618928a5952
    with:
      build-container: false
      generate-sbom: false
      slsa-attestation: false
