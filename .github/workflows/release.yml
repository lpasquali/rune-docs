name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: lpasquali/rune-ci/.github/workflows/release.yml@72ffc70b5253c30afd47b06e81eff3f9b08c04c8
    with:
      build-container: false
      generate-sbom: false
      slsa-attestation: false
