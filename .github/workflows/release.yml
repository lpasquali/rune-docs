# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: lpasquali/rune-ci/.github/workflows/release.yml@d1d2d2863dac135812bf98b89ae6f9bef8c33e63
    with:
      build-container: false
      generate-sbom: false
      slsa-attestation: false
