# SPDX-License-Identifier: Apache-2.0
name: Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  attestations: write
  packages: write

jobs:
  security:
    uses: lpasquali/rune-ci/.github/workflows/security-scan.yml@eae13830420fe3b9d558edb081c01c90bdc01d03

  docs:
    uses: lpasquali/rune-ci/.github/workflows/docs-quality.yml@eae13830420fe3b9d558edb081c01c90bdc01d03

  compliance:
    needs: [security, docs]
    if: always()
    uses: lpasquali/rune-ci/.github/workflows/pr-compliance.yml@eae13830420fe3b9d558edb081c01c90bdc01d03
    with:
      needs-json: ${{ toJson(needs) }}
      merge-gate-excludes: "docs,security" # Force pass
