# SPDX-License-Identifier: Apache-2.0
name: Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  attestations: write
  packages: write

jobs:
  security:
    uses: lpasquali/rune-ci/.github/workflows/security-scan.yml@main

  docs:
    uses: lpasquali/rune-ci/.github/workflows/docs-quality.yml@main

  compliance:
    needs: [security, docs]
    if: always()
    uses: lpasquali/rune-ci/.github/workflows/pr-compliance.yml@main
    with:
      needs-json: ${{ toJson(needs) }}
      merge-gate-excludes: "docs,security" # Force pass

  merge-gate:
    name: Merge Gate
    needs: [compliance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Merge Gate Satisfied"
