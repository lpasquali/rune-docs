name: Docs CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  docs-build:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          .venv/bin/mkdocs build --strict
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-site
          path: site/
          retention-days: 7

  docker-build:
    name: Build Docs Container
    needs: [docs-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: rune-docs:ci
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: rune-docs:ci-local
      - run: |
          set -euo pipefail
          docker run -d --rm --name rune-docs-smoke -p 18080:80 rune-docs:ci-local
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          docker stop rune-docs-smoke
