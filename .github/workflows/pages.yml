# Deploy MkDocs to GitHub Pages with versioned docs (mike).
#
# Triggers:
#   - push to main
#   - push to release-*
#   - push of a tag matching v*
#   - workflow_dispatch (manual trigger)
#
# Each tag/branch creates a versioned docs snapshot.
# The "latest" alias always points to the newest stable release.

name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
      - 'release-*'
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version alias (e.g. v0.0.0a1)"
        required: false
        default: "latest"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Docs/Deploy-to-Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install MkDocs and mike
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt mike

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version alias
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "alias=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "alias=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up stale branches
        run: |
          # Fetch the gh-pages branch to read versions
          git fetch origin gh-pages:gh-pages || echo "No gh-pages branch yet"
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
             git checkout gh-pages
             if [ -f versions.json ]; then
                # Get list of deployed versions
                VERSIONS=$(python -c "import json; print(' '.join([v['version'] for v in json.load(open('versions.json'))]))")
                git checkout -
                # Get active branches and tags from remote
                ACTIVE_REFS=$(git ls-remote --heads --tags origin | awk -F'refs/(heads|tags)/' '{print $2}' | sed 's/\^{}//' | sort -u)
                
                for V in $VERSIONS; do
                   if [ "$V" != "latest" ] && ! echo "$ACTIVE_REFS" | grep -qx "^$V$"; then
                      echo "Deleting stale version: $V"
                      mike delete --push $V || true
                   fi
                done
             else
                git checkout -
             fi
          fi

      - name: Deploy versioned docs
        run: |
          # Deploy current version
          mike deploy --push --update-aliases "${{ steps.version.outputs.alias }}"
          
          # If this is a tag or main branch, we can update latest
          if [[ "${{ steps.version.outputs.alias }}" == v* ]] || [[ "${{ steps.version.outputs.alias }}" == "main" ]]; then
             mike deploy --push --update-aliases "${{ steps.version.outputs.alias }}" latest
             mike set-default --push latest
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
